  - {id: go_away, file: go_away.wav, text: "Leave me be. I have nothing for you.", speaker: villager woman, tags: [female, villager, angry, refuse], lang: en}
  - {id: over_here, file: over_here.wav, text: "Over here! Quickly!", speaker: villager woman, tags: [female, villager, call, afraid], lang: en}
